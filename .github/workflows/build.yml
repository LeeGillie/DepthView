# Builds DepthView on all three desktop platforms and proves the headless paths work
# on each of them.
#
# The point of this workflow is the matrix. DepthView is developed on Windows and claims
# Windows, macOS and Linux; until this ran, that claim rested on Avalonia's reputation
# rather than on evidence. A red macOS job here is worth more than a green one, because
# it is the only thing standing between a wrong README and a stranger discovering it.
#
# The GUI is not exercised - CI runners have no display. --report and --render both
# return before Avalonia is initialised, so they are genuinely headless and are the two
# paths worth checking automatically.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false      # one platform failing must not hide the state of the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install NumPy
        run: python -m pip install --quiet numpy

      - name: Build
        shell: bash
        run: dotnet build DepthView.slnx -c Release --nologo -warnaserror

      - name: Generate fixtures
        shell: bash
        run: |
          python tests/make_fixtures.py
          python tests/make_textures.py

      - name: Locate the binary
        id: exe
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "path=src/DepthView/bin/Release/net8.0/DepthView.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=src/DepthView/bin/Release/net8.0/DepthView" >> "$GITHUB_OUTPUT"
          fi

      # --report exits 1 when it flags an imposter, which the fixture set is built to
      # contain, so 1 is the pass condition here and 0 would mean detection had broken.
      - name: Analyse the fixtures
        shell: bash
        run: |
          set +e
          "${{ steps.exe.outputs.path }}" --report tests/fixtures --summary
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" -ne 1 ]; then
            echo "::error::Expected exit code 1 (imposters present in the fixture set), got $code"
            exit 1
          fi

      - name: Confirm every fixture was classified as expected
        shell: bash
        run: python tests/check_report.py tests/fixtures/depthview-report.txt

      - name: Render a relief headlessly
        shell: bash
        run: |
          "${{ steps.exe.outputs.path }}" --render tests/fixtures/relief_demo.png --material brass --size 400 --out relief-ci.png
          test -s relief-ci.png

      - name: Analyse the committed samples
        shell: bash
        run: |
          set +e
          "${{ steps.exe.outputs.path }}" --report samples --summary --out samples-ci.txt
          echo "samples exit code: $?"

      # Everything above this point runs before Avalonia is initialised, so none of it
      # says whether the actual program starts. These steps open the real window, load a
      # real image, let the analysis and the histogram settle, capture the window to a PNG
      # and exit. The PNG is uploaded, so a human can look at what the window really looked
      # like on a platform none of us owns - fonts, layout, the lot.
      #
      # Linux needs a display; Xvfb provides one. libfontconfig1 and libx11 are what
      # Avalonia's Skia backend actually reaches for, and a missing font package is the
      # classic way a cross-platform UI turns out to render nothing but boxes.
      - name: Install a virtual display and font stack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libx11-6 libice6 libsm6 fonts-dejavu-core

      - name: Open the real window (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1100x24" \
            "${{ steps.exe.outputs.path }}" samples/01-genuine-16bit.png \
            --screenshot gui-${{ matrix.os }}.png
          test -s "gui-${{ matrix.os }}.png"

      - name: Open the real window (macOS and Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          "${{ steps.exe.outputs.path }}" samples/01-genuine-16bit.png \
            --screenshot "gui-${{ matrix.os }}.png"
          test -s "gui-${{ matrix.os }}.png"

      - name: Open the About box (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1100x24" \
            "${{ steps.exe.outputs.path }}" --about --delay 900 \
            --screenshot about-${{ matrix.os }}.png
          test -s "about-${{ matrix.os }}.png"

      # The window at its own minimum size, which is where the layout breaks first. A
      # 1024x768 CI runner is what found the buttons and the verdict card being pushed off
      # the bottom, and nothing on a developer's monitor can reproduce that. Capturing the
      # minimum on every push means the next person to change this layout sees the damage.
      - name: Capture the window at its minimum size (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1100x24" \
            "${{ steps.exe.outputs.path }}" samples/02-imposter-x257.png \
            --window 1024 660 --screenshot minsize-${{ matrix.os }}.png
          test -s "minsize-${{ matrix.os }}.png"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output-${{ matrix.os }}
          path: |
            relief-ci.png
            samples-ci.txt
            gui-*.png
            about-*.png
            minsize-*.png
            tests/fixtures/depthview-report.txt
          if-no-files-found: warn
