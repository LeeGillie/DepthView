# Publishes DepthView for seven platforms and attaches the zips to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag -a v1.4.0 -m "DepthView 1.4.0"
#     git push origin v1.4.0
#
# Or run manually from the Actions tab with dry_run left on, which builds and uploads
# everything as workflow artefacts WITHOUT creating a release. Use that to prove the
# matrix works before spending a tag on it - a tag is cheap to delete and awkward to
# delete after people have fetched it.
#
# Each platform ships as DepthView-<version>-<rid>.zip holding one DepthView/ folder (the
# program, README.txt, LICENSE.txt; a DepthView.app on macOS), built by
# packaging/make_bundle.py. Those names are a contract with the in-place updater
# (src/DepthView/Updates/UpdateService.cs), which finds its platform's zip on the latest
# release by name and verifies it against the digest GitHub publishes for the asset, with
# SHA256SUMS.txt as the fallback. Rename either and every installed copy stops updating.
#
# Windows and Linux cross-compile on one Linux runner. macOS builds on a macOS runner,
# because Apple silicon will not run unsigned native code at all: the .app is signed ad hoc
# there. Ad hoc is not notarisation - Gatekeeper still asks the user once - but without it an
# M-series Mac kills the program on launch.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artefacts without creating a release'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: ubuntu-latest }
          - { rid: win-x86,     os: ubuntu-latest }
          - { rid: win-arm64,   os: ubuntu-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish src/DepthView/DepthView.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o out/${{ matrix.rid }} \
            --nologo -v quiet

      # One zip per platform, named for the platform and version. A user downloading three of
      # these into one folder must not end up with DepthView.zip, DepthView(1).zip...
      - name: Bundle
        id: bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            refs/*|main|"") version="dev" ;;
          esac
          if [[ "${{ matrix.rid }}" == win-* ]]; then bin="out/${{ matrix.rid }}/DepthView.exe"
          else bin="out/${{ matrix.rid }}/DepthView"; fi
          test -f "$bin" || { echo "::error::publish produced no binary at $bin"; ls -R out; exit 1; }
          python3 packaging/make_bundle.py --rid ${{ matrix.rid }} --version "$version" \
            --binary "$bin" --dist dist
          echo "zip=DepthView-${version}-${{ matrix.rid }}.zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A download that cannot answer --version is not a delivery - and --version is exactly
      # what the updater runs on a freshly downloaded copy before it will install it. Each
      # runner can execute its own architecture only, so linux-x64 and osx-arm64 are the two
      # checked here; the macOS one also proves the ad hoc signature is accepted.
      - name: Smoke test the Linux bundle
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir smoke && (cd smoke && unzip -q "../dist/${{ steps.bundle.outputs.zip }}")
          test -x smoke/DepthView/DepthView
          smoke/DepthView/DepthView --version | tee v.txt
          grep -q "DepthView ${{ steps.bundle.outputs.version }}" v.txt || [ "${{ steps.bundle.outputs.version }}" = dev ]
          smoke/DepthView/DepthView --help | head -5
          python -m pip install --quiet numpy
          python tests/make_fixtures.py
          set +e
          smoke/DepthView/DepthView --report tests/fixtures --summary
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1, got $code"; exit 1; }
          python tests/check_report.py tests/fixtures/depthview-report.txt

      - name: Smoke test the macOS bundle
        if: matrix.rid == 'osx-arm64'
        run: |
          mkdir smoke && (cd smoke && unzip -q "../dist/${{ steps.bundle.outputs.zip }}")
          codesign --verify --strict --verbose=2 smoke/DepthView/DepthView.app
          smoke/DepthView/DepthView.app/Contents/MacOS/DepthView --version

      - uses: actions/upload-artifact@v7
        with:
          name: DepthView-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create the release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staged
          merge-multiple: true

      # Someone who downloads a release gets the program and nothing to point it at, while
      # every announcement of this tool tells them to try the samples. Ship them.
      # `git ls-files` rather than the whole folder: samples/ is where a user drops their own
      # artwork to test, and none of that belongs in a public release asset.
      - name: Package the samples
        run: |
          mkdir -p samples-out
          git ls-files samples | while read -r f; do cp "$f" samples-out/; done
          ls -l samples-out
          (cd samples-out && zip -q -r ../staged/DepthView-samples.zip .)

      # Unsigned builds make checksums worth more than usual: they are the only way a user
      # can tell a genuine download from a tampered one. The updater prefers the per-asset
      # digest GitHub computes itself, and falls back to this file.
      - name: Checksums
        run: |
          cd staged
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" staged/* \
            --title "DepthView ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE_TEMPLATE.md \
            --generate-notes \
            --verify-tag
